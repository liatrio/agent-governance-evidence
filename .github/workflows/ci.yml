name: acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  draft-release-proof:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - env:
          GH_DEBUG: api
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '386593269'
          TAG: v0.1.0-alpha.2
        run: |
          set -euo pipefail
          gh --version
          response=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          printf '%s\n' "$response"
          RESPONSE="$response" python3 - <<'PY'
            import json
            import os

            response = os.environ["RESPONSE"]
            head, sep, body = response.partition("\r\n\r\n")
            if not sep:
                head, sep, body = response.partition("\n\n")
            if not sep:
                raise SystemExit("missing HTTP headers in gh api response")
            status = head.splitlines()[0].strip()
            if status != "HTTP/2.0 200 OK":
                raise SystemExit(f"unexpected HTTP status: {status}")
            release = json.loads(body)
            if release.get("id") != 386593269:
                raise SystemExit(f"unexpected release id: {release.get('id')}")
            if release.get("tag_name") != "v0.1.0-alpha.2":
                raise SystemExit(f"unexpected tag_name: {release.get('tag_name')}")
            if release.get("draft") is not True:
                raise SystemExit(f"unexpected draft state: {release.get('draft')}")
            print(json.dumps({
                "id": release.get("id"),
                "tag_name": release.get("tag_name"),
                "draft": release.get("draft"),
                "prerelease": release.get("prerelease"),
                "immutable": release.get("immutable"),
            }, sort_keys=True))
          PY

  go-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          check-latest: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: ./scripts/ci.sh

  producer-regeneration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          check-latest: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: arm64
      - run: ./scripts/regenerate-producers.sh
