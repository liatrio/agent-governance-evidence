name: draft metadata proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-draft-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PATH: /repos/liatrio/agent-governance-evidence/releases/386593269
      EXPECTED_ID: "386593269"
      EXPECTED_TAG: v0.1.0-alpha.2
      EXPECTED_DRAFT: "true"
    steps:
      - name: print gh version
        run: gh --version
      - name: prove release metadata
        shell: bash
        run: |
          set -euo pipefail

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          set +e
          gh api --include "$RELEASE_PATH" >"$response"
          rc=$?
          set -e

          python3 - "$response" "$rc" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          rc = int(sys.argv[2])
          lines = text.splitlines()
          http_status = None
          for line in lines:
              match = re.match(r"^HTTP/\S+\s+(\d{3})(?:\s|$)", line.strip())
              if match:
                  http_status = match.group(1)
                  break
          if http_status is None:
              print("probe failed: missing numeric http status")
              raise SystemExit(1)
          print(f"numeric_status={http_status}")
          if rc != 0 or http_status != "200":
              print(f"probe failed: gh api rc={rc} status={http_status}")
              raise SystemExit(1)

          start = None
          for i, line in enumerate(lines):
              if line.strip().startswith("{"):
                  start = i
                  break
          if start is None:
              print("probe failed: missing json body")
              raise SystemExit(1)

          data = json.loads("\n".join(lines[start:]))
          actual_id = data.get("id")
          actual_tag = data.get("tag_name")
          actual_draft = data.get("draft")

          print(f"id={actual_id}")
          print(f"tag_name={actual_tag}")
          print(f"draft={actual_draft}")

          if (
              str(actual_id) != os.environ["EXPECTED_ID"]
              or actual_tag != os.environ["EXPECTED_TAG"]
              or actual_draft != (os.environ["EXPECTED_DRAFT"] == "true")
          ):
              print("probe failed: release identity mismatch")
              raise SystemExit(1)
          PY
