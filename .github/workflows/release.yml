name: draft prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  trusted-source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        env:
          ACTOR: ${{ github.actor }}
          RERUN_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit=$(./scripts/release-source-guard.sh)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  native-build:
    needs: trusted-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          - os: macos-15
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted-source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          check-latest: false
      - run: ./scripts/package-release.sh --tag "$TAG" --output release-assets
        env:
          TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: release-assets/
          if-no-files-found: error

  attest-and-draft:
    needs: [trusted-source, native-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted-source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*'
          path: incoming
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/aggregate-release-assets.py --tag "$TAG" --incoming incoming --output release-assets
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/agent-governance-evidence_${{ github.ref_name }}_linux-amd64.tar.gz
            release-assets/agent-governance-evidence_${{ github.ref_name }}_darwin-arm64.tar.gz
            release-assets/agent-governance-evidence_${{ github.ref_name }}_source.tar.gz
            release-assets/SHA256SUMS
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f "${{ steps.attest.outputs.bundle-path }}"
          cp "${{ steps.attest.outputs.bundle-path }}" release-assets/build-provenance.sigstore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-assets
          path: release-assets/
          if-no-files-found: error

  create-draft:
    needs: [trusted-source, attest-and-draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted-source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-assets
          path: release-assets
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/create-release-draft.sh --tag "$TAG" --assets-dir release-assets --repository "$GITHUB_REPOSITORY"
